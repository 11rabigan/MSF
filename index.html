<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSF World Refugee Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; }
        #map { height: 100vh; width: 100%; }

        .legend {
            background: white;
            padding: 12px 16px;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            font-family: 'DM Sans', sans-serif;
            font-size: 12px;
            line-height: 1.5;
        }
        .legend h4 {
            margin: 0 0 8px 0;
            font-size: 13px;
            font-weight: 600;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }

        .legend-item span {
            margin-left: 4px;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>

        const MAX_ZOOM  = 6;
        const BASE_ZOOM = 3;

        const MSF_COUNTRIES = [
            "Armenia", "Bangladesh", "Afghanistan", "Belgium", "Benin",
            "Brazil", "Bulgaria", "Burkina Faso", "Burundi", "Central African Republic",
            "Cameroon", "Colombia", "Chad", "Comoros", "Costa Rica",
            "Egypt", "Democratic Republic of the Congo", "Ethiopia", "France", "Greece",
            "Guatemala", "Guinea", "Honduras", "Hong Kong S.A.R.", "India",
            "Haiti", "Indonesia", "Iran", "Iraq", "Italy",
            "Ivory Coast", "Jordan", "Kazakhstan", "Kenya", "Kiribati",
            "Kyrgyzstan", "Liberia", "Lebanon", "Libya", "Madagascar",
            "Malawi", "Malaysia", "Mali", "Mauritania", "Mexico",
            "Mozambique", "Nigeria", "Niger", "Myanmar", "Pakistan",
            "Palestine", "Panama", "Papua New Guinea", "Philippines", "Poland",
            "Republic of Serbia", "Russia", "Sierra Leone", "South Sudan", "Somalia",
            "South Africa", "Tajikistan", "Sudan", "Syria", "Thailand",
            "Uganda", "Ukraine", "United Kingdom", "United Republic of Tanzania",
            "Uzbekistan", "Venezuela", "Zambia", "Zimbabwe", "Yemen", "eSwatini"
        ];

        const TOP_FIVE = ["Syria", "Afghanistan", "Ukraine", "South Sudan", "Sudan"];

        const GEOJSON_URL  = 'https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson';
        const REFUGEES_URL = 'https://raw.githubusercontent.com/11rabigan/MSF/refs/heads/main/Refugee_Data_2024.json';

        const map = L.map('map', { zoomSnap: 0.5, minZoom: 2, maxZoom: MAX_ZOOM })
                     .setView([26, 45], BASE_ZOOM);

        const baseMap = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://openstreetmap.org">OpenStreetMap</a> &copy; <a href="https://carto.com">CARTO</a>',
            maxZoom: MAX_ZOOM
        }).addTo(map);

        const STYLE_ALL = {
            fillColor: '#cccccc',
            color: '#878787',
            weight: 1,
            fillOpacity: 0.3,
            opacity: 0.5
        };

        const STYLE_MSF = {
            fillColor: '#E56C57',
            color: '#E56C57',
            weight: 0,
            fillOpacity: 0.5,
            opacity: 0
        };

        Promise.all([
            fetch(GEOJSON_URL).then(r => r.json()),
            fetch(REFUGEES_URL).then(r => r.json())
        ])
        .then(([geoData, refugeeData]) => {

            const allCountriesLayer = L.geoJSON(geoData, {
                style: () => STYLE_ALL
            }).addTo(map);

            const msfLayer = L.geoJSON(geoData, {
                filter: f => MSF_COUNTRIES.includes(f.properties.name),
                style: () => STYLE_MSF
            }).addTo(map);

            const maxRefugees = Math.max(...refugeeData.features.map(f => f.properties.Refugees));

            const top5Layer   = L.layerGroup().addTo(map);
            const bubbleLayer = L.layerGroup();

            refugeeData.features.forEach(f => {
                const count = f.properties.Refugees;
                if (count <= 0) return;
                if (TOP_FIVE.includes(f.properties.Country_Name)) return;

                const lng = f.geometry.coordinates[0];
                const lat = f.geometry.coordinates[1];

                L.circleMarker([lat, lng], {
                    radius: Math.max(3, Math.sqrt(count / maxRefugees) * 25),
                    fillColor: '#A03339',
                    color: '#A03339',
                    weight: 1,
                    fillOpacity: 0.5
                })
                .bindTooltip(`${f.properties.Country_Name}: ${count.toLocaleString()} refugees`)
                .addTo(bubbleLayer);
            });

            refugeeData.features.forEach(f => {
                if (!TOP_FIVE.includes(f.properties.Country_Name)) return;

                const count = f.properties.Refugees;
                const lng   = f.geometry.coordinates[0];
                const lat   = f.geometry.coordinates[1];

                L.circleMarker([lat, lng], {
                    radius: Math.max(3, Math.sqrt(count / maxRefugees) * 25),
                    fillColor: '#FF6B00',
                    color: '#FF6B00',
                    weight: 2,
                    fillOpacity: 0.5
                })
                .bindPopup(`
                    <b>${f.properties.Country_Name}</b><br>
                    Refugees: ${count.toLocaleString()}<br>
                    <img src="YOUR_IMAGE_URL" width="150"/><br>
                    <a href="YOUR_LINK" target="_blank">Read more</a>
                `)
                .addTo(top5Layer);
            });

            // ── Legend ────────────────────────────────────────────────────────
            function buildLegendHTML() {
                let html = '<h4>Refugees by Origin</h4>';

                const MAX_SVG_SIZE = 54;

                const tiers = [
                    { label: '5,000,000+', count: 5000000, color: '#A03339' },
                    { label: '1,000,000',  count: 1000000, color: '#A03339' },
                    { label: '250,000',    count: 250000,  color: '#A03339' },
                    { label: '50,000',     count: 50000,   color: '#A03339' },
                ];

                tiers.forEach(t => {
                    const r        = Math.max(3, Math.sqrt(t.count / maxRefugees) * 25);
                    const diameter = r * 2;
                    const pad      = 1;

                    html += `
                        <div class="legend-item">
                            <svg width="${MAX_SVG_SIZE}" height="${diameter + pad * 2}" style="flex-shrink:0">
                                <circle
                                    cx="${MAX_SVG_SIZE / 2}" cy="${r + pad}" r="${r}"
                                    fill="${t.color}" fill-opacity="0.5"
                                    stroke="${t.color}" stroke-width="1"
                                />
                            </svg>
                            <span>${t.label}</span>
                        </div>`;
                    
                    html += `<hr style="border:none; border-top:1px solid #eee; margin: 8px 0;">`;
                    });
                    html += `
                        <div class="legend-item">
                            <svg width="${MAX_SVG_SIZE}" height="24" style="flex-shrink:0">
                                <circle
                                    cx="${MAX_SVG_SIZE / 2}" cy="12" r="10"
                                    fill="#FF6B00" fill-opacity="0.5"
                                    stroke="#FF6B00" stroke-width="2"
                                />
                            </svg>
                            <span>Major Displacement Origins</span>
                        </div>`;

                html += `<hr style="border:none; border-top:1px solid #eee; margin: 8px 0;">`;
                html += `<h4 style="margin: 0 0 8px 0;">MSF Operations</h4>`;
                html += `
                    <div class="legend-item">
                        <svg width="${MAX_SVG_SIZE}" height="20" style="flex-shrink:0">
                            <rect
                                x="1" y="1" width="18" height="12"
                                fill="#E56C57" fill-opacity="0.5"
                                stroke="#E56C57" stroke-width="1"
                            />
                        </svg>
                        <span>MSF Operations</span>
                    </div>`;
                
                return html;
            }

            const legend = L.control({ position: 'bottomright' });
            legend.onAdd = function() {
                const div = L.DomUtil.create('div', 'legend');
                div.innerHTML = buildLegendHTML();
                return div;
            };
            legend.addTo(map);

            // ── Layer control ─────────────────────────────────────────────────
            L.control.layers(
                { "Carto Light": baseMap },
                {
                    "All Countries": allCountriesLayer,
                    "MSF Locations": msfLayer,
                    "Major Refugee Origins": top5Layer,
                    "All Refugee Origins": bubbleLayer,
                    
                }
            ).addTo(map);

        })
        .catch(err => console.error("Failed to load data:", err));

    </script>
</body>
</html>
